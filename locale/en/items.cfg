[item-description]
s-asteroid-chunk=Ordinary chondrite. Iron, stone, a trickle of copper and sulfur.
m-asteroid-chunk=Iron-nickel. Iron, nickel, tungsten.
c-asteroid-chunk=Carbonaceous. Ice, carbon, calcite, sulfur, hydrated silicate.
v-asteroid-chunk=Basaltic. Stone, phosphate rock, calcite.
e-asteroid-chunk=Enstatite. Sulfur, silicon, stone.
d-asteroid-chunk=Cometary. Ice, carbon, volatile ice.
nickel-ore=From advanced M-type crushing. Smelts into nickel plate.
nickel-plate=Alloy metal for turbines, heat exchangers and low density structures.
silicon=From advanced E-type crushing. Goes into circuits and solar panels.
phosphate-rock=From advanced V-type crushing. Processed into fluorine, uranium ore and holmium ore.
hydrated-silicate=From advanced C-type crushing. Leached into lithium brine and ammonia.
volatile-ice=From advanced D-type crushing. Separated into ammonia, methane and water.
volatiles-science-pack=__ITEM__volatiles-science-pack__ replaces agricultural science.

