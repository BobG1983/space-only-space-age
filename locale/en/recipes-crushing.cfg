[recipe-description]
s-asteroid-crushing=Iron ore and stone, with a chance of copper ore and sulfur. Returns the chunk 30% of the time.
advanced-s-asteroid-crushing=Iron ore, copper ore and stone, with a chance of sulfur and a trace of phosphate rock. Returns the chunk 10% of the time.
m-asteroid-crushing=Iron ore, with a chance of nickel ore and copper ore. Returns the chunk 30% of the time.
advanced-m-asteroid-crushing=Iron ore and nickel ore, with a chance of tungsten ore and copper ore. Returns the chunk 10% of the time.
m-asteroid-refining=Slow. Iron ore, nickel ore and tungsten ore in fixed amounts. Returns the chunk 5% of the time.
c-asteroid-crushing=Ice, carbon and stone. Returns the chunk 30% of the time.
advanced-c-asteroid-crushing=Ice, carbon, calcite and sulfur, with a chance of hydrated silicate. Returns the chunk 10% of the time.
v-asteroid-crushing=Stone and iron ore, with a chance of phosphate rock. Returns the chunk 30% of the time.
advanced-v-asteroid-crushing=Stone, phosphate rock, calcite and iron ore, with a chance of copper ore. Returns the chunk 10% of the time.
e-asteroid-crushing=Stone, sulfur and iron ore. Returns the chunk 30% of the time.
advanced-e-asteroid-crushing=Silicon, sulfur, stone and iron ore. Returns the chunk 10% of the time.
d-asteroid-crushing=Ice and carbon. Returns the chunk 30% of the time.
advanced-d-asteroid-crushing=Ice, carbon and volatile ice. Returns the chunk 10% of the time.
s-asteroid-reprocessing=One roll per chunk: 40% the same S-type chunk back, 20% an M-type chunk, 20% a D-type chunk, 20% nothing.
m-asteroid-reprocessing=One roll per chunk: 40% the same M-type chunk back, 20% an E-type chunk, 20% an S-type chunk, 20% nothing.
e-asteroid-reprocessing=One roll per chunk: 40% the same E-type chunk back, 20% a V-type chunk, 20% an M-type chunk, 20% nothing.
v-asteroid-reprocessing=One roll per chunk: 40% the same V-type chunk back, 20% a C-type chunk, 20% an E-type chunk, 20% nothing.
c-asteroid-reprocessing=One roll per chunk: 40% the same C-type chunk back, 20% a D-type chunk, 20% a V-type chunk, 20% nothing.
d-asteroid-reprocessing=One roll per chunk: 40% the same D-type chunk back, 20% an S-type chunk, 20% a C-type chunk, 20% nothing.
